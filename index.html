<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>四球追分</title>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="fade"></div>
    <header id="hud">
      <div class="brand">
        <p class="kicker">中式四球</p>
        <h1>追分</h1>
        <p id="turn">东泽 开球</p>
        <p id="call">开球</p>
      </div>
      <div class="scores">
        <div><span>东泽</span><strong id="score-a">0</strong></div>
        <div><span>日峰</span><strong id="score-b">0</strong></div>
      </div>
      <ul class="legend">
        <li>犯规 <b>1</b></li>
        <li>黄金九 <b>4</b></li>
        <li>大金 <b>10</b></li>
        <li>小金 <b>7</b></li>
        <li>普胜 <b>4</b></li>
        <li>让杆双倍 <b>8 / 14 / 20</b></li>
      </ul>
      <div class="row">
        <button id="pass" type="button" disabled>让杆</button>
        <button id="reball" type="button" hidden>重摆母球</button>
      </div>
      <label class="cloth">
        台呢
        <input id="cloth" type="color" value="#127a3e" aria-label="台呢颜色" />
      </label>
      <div id="swatches"></div>
      <label class="cloth lamp">
        灯光
        <input id="lamp" type="range" min="0" max="100" value="25" aria-label="灯光" />
      </label>
    </header>
    <div id="spin-wrap">
      <p>击点</p>
      <div id="spin" role="slider" aria-label="母球击点">
        <span id="spin-dot"></span>
      </div>
      <p class="hint">高杆 · 缩杆 · 塞 · 斯登</p>
    </div>
    <div id="power-wrap">
      <div id="power"><div id="power-fill"></div></div>
      <p id="help">移动瞄准，按住蓄力，松手出杆。右键转动视角。</p>
    </div>
    <div id="toast"></div>
    <div id="jackpot" hidden><span id="jackpot-word">大金</span></div>
    <section id="settle" hidden>
      <p id="settle-line"></p>
      <div class="faces">
        <figure>
          <svg class="prop" viewBox="0 0 140 72" aria-hidden="true">
            <rect x="8" y="30" width="92" height="16" rx="8" fill="#8a5a32" />
            <circle cx="104" cy="38" r="9" fill="#ff7a2a" />
            <circle cx="118" cy="22" r="14" fill="#f4f1ea" opacity="0.45" />
            <circle cx="128" cy="10" r="10" fill="#f4f1ea" opacity="0.28" />
          </svg>
          <figcaption id="settle-win"></figcaption>
        </figure>
        <figure>
          <svg class="prop" viewBox="0 0 140 72" aria-hidden="true">
            <rect x="34" y="30" width="18" height="32" rx="3" fill="#6a3a22" />
            <circle cx="58" cy="32" r="16" fill="#d5dbe0" />
            <circle cx="58" cy="32" r="5" fill="#c83b2e" />
            <rect x="70" y="26" width="58" height="10" rx="2" fill="#9aa3aa" />
          </svg>
          <figcaption id="settle-lose"></figcaption>
        </figure>
      </div>
      <p class="totals">东泽 <strong id="end-a">0</strong> · 日峰 <strong id="end-b">0</strong></p>
      <p id="settle-next"></p>
      <button id="again" type="button" hidden>再来一局</button>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
